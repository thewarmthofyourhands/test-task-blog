<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Articles</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; background: #fafafa; color: #111; }
      header { padding: 16px 20px; background: #fff; border-bottom: 1px solid #e9e9e9; position: sticky; top: 0; }
      a { color: #0b57d0; text-decoration: none; }
      a:hover { text-decoration: underline; }
      .container { max-width: 980px; margin: 0 auto; padding: 20px; }
      .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 12px; }
      .card { grid-column: span 12; background: #fff; border: 1px solid #e9e9e9; border-radius: 10px; padding: 12px; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
      .muted { color: #555; }
      .pill { display: inline-block; border: 1px solid #e0e0e0; border-radius: 999px; padding: 4px 10px; font-size: 12px; background: #fcfcfc; }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; }
      button, select { padding: 8px 10px; border-radius: 8px; border: 1px solid #ddd; background: #fff; cursor: pointer; }
      button:hover { background: #f3f6fc; }
      .article-list { display: grid; gap: 10px; }
      .article { border: 1px solid #eee; border-radius: 8px; padding: 10px; background: #fff; }
      .article h3 { margin: 0 0 6px 0; font-size: 18px; }
      .article p { margin: 0 0 6px 0; }
      .meta { font-size: 12px; color: #666; display: flex; gap: 10px; flex-wrap: wrap; }
      .pagination { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      .hero { padding: 10px 0; }
      .title { margin: 0 0 6px 0; }
      .desc { margin: 0 0 10px 0; color: #333; }
      @media (min-width: 720px) {
        .card.span-6 { grid-column: span 6; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="container row" style="justify-content: space-between; padding: 0;">
        <div><a href="#/">Главная</a></div>
        <div class="muted">Demo SPA</div>
      </div>
    </header>

    <main class="container">
      <div id="app">Загрузка…</div>
    </main>

    <script>
      const API_BASE = ""; // если фронт и api на одном домене, иначе задайте, например: "http://localhost:8080"

      function qs(name) {
        const params = new URLSearchParams(location.search);
        return params.get(name);
      }

      function fmtDate(iso) {
        try { return new Date(iso).toLocaleString(); } catch { return iso; }
      }

      async function apiFetch(path) {
        const res = await fetch(API_BASE + path, { headers: { Accept: "application/json" } });
        if (!res.ok) {
          const text = await res.text();
          throw new Error("API error " + res.status + ": " + text);
        }
        return res.json();
      }

      function renderArticleCard(a) {
        return `<article class="article">
          <h3><a href="#/articles/${a.id}">${escapeHtml(a.title)}</a></h3>
          <p class="muted">${escapeHtml(a.description ?? "")}</p>
          <div class="meta">
            <span>Просмотры: ${Number(a.views_count ?? 0)}</span>
            <span>Опубликовано: ${fmtDate(a.published_at)}</span>
          </div>
        </article>`;
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      async function showHome() {
        const app = document.getElementById("app");
        app.textContent = "Загрузка категорий…";
        const json = await apiFetch("/api/categories");
        const categories = json.data ?? [];
        if (!categories.length) {
          app.textContent = "Нет категорий";
          return;
        }

        const html = ["<section class='grid'>"];
        for (const cat of categories) {
          const articles = (cat.articles ?? []).slice(0, 3);
          html.push(`<div class="card span-6"><div class="hero">
            <h2 class="title">${escapeHtml(cat.name)}</h2>
            <p class="desc">${escapeHtml(cat.description ?? "")}</p>
            <div class="actions"><a class="pill" href="#/categories/${cat.id}">Все статьи</a></div>
          </div>
          <div class="article-list">${articles.map(renderArticleCard).join("")}</div>
          </div>`);
        }
        html.push("</section>");
        app.innerHTML = html.join("");
      }

      function currentHashPath() {
        const h = location.hash || "#/";
        return h.replace(/^#/, "");
      }

      function parsePath() {
        const path = currentHashPath();
        const parts = path.split("?");
        const base = parts[0];
        const query = parts[1] ? new URLSearchParams(parts[1]) : new URLSearchParams();
        return { base, query };
      }

      function setHash(base, query) {
        const q = query.toString();
        location.hash = q ? `${base}?${q}` : base;
      }

      async function showCategory(categoryId, query) {
        const app = document.getElementById("app");
        app.textContent = "Загрузка категории…";

        const [catJson, articlesJson] = await Promise.all([
          apiFetch(`/api/categories/${categoryId}`),
          apiFetch(`/api/categories/${categoryId}/articles?` + query.toString()),
        ]);

        const cat = catJson.data;
        const list = articlesJson.data;
        const items = list.items ?? [];
        const pagination = list.pagination ?? { page: 1, last_page: 1, per_page: 10, total: items.length };
        const sort = list.sort ?? { field: "published_at", order: "desc" };

        const sortField = query.get("sort") || sort.field || "published_at";
        const sortOrder = query.get("order") || sort.order || "desc";
        const page = Number(query.get("page") || pagination.page || 1);
        const perPage = Number(query.get("per_page") || pagination.per_page || 10);

        const base = `#/categories/${categoryId}`;

        const html = [`<section>
          <h1 class="title">${escapeHtml(cat.name)}</h1>
          <p class="desc">${escapeHtml(cat.description ?? "")}</p>
          <div class="row actions" style="margin: 10px 0;">
            <label>Сортировка:
              <select id="sortField">
                <option value="published_at">По дате публикации</option>
                <option value="views_count">По просмотрам</option>
              </select>
            </label>
            <label>Порядок:
              <select id="sortOrder">
                <option value="desc">По убыванию</option>
                <option value="asc">По возрастанию</option>
              </select>
            </label>
            <label>На странице:
              <select id="perPage">
                <option value="3">3</option>
                <option value="6">6</option>
                <option value="10">10</option>
              </select>
            </label>
          </div>
          <div class="article-list">${items.map(renderArticleCard).join("")}</div>
          <div class="pagination" style="margin-top: 12px;">
            <button id="prevPage" ${page <= 1 ? "disabled" : ""}>Назад</button>
            <span class="muted">Страница ${page} из ${pagination.last_page}</span>
            <button id="nextPage" ${page >= pagination.last_page ? "disabled" : ""}>Вперёд</button>
          </div>
        </section>`];

        app.innerHTML = html.join("");

        const sortFieldEl = document.getElementById("sortField");
        const sortOrderEl = document.getElementById("sortOrder");
        const perPageEl = document.getElementById("perPage");
        sortFieldEl.value = sortField;
        sortOrderEl.value = sortOrder;
        perPageEl.value = String(perPage);

        sortFieldEl.addEventListener("change", () => {
          const q = new URLSearchParams(query);
          q.set("sort", sortFieldEl.value);
          q.set("order", sortOrderEl.value);
          q.set("page", "1");
          setHash(base, q);
        });
        sortOrderEl.addEventListener("change", () => {
          const q = new URLSearchParams(query);
          q.set("sort", sortFieldEl.value);
          q.set("order", sortOrderEl.value);
          q.set("page", "1");
          setHash(base, q);
        });
        perPageEl.addEventListener("change", () => {
          const q = new URLSearchParams(query);
          q.set("per_page", perPageEl.value);
          q.set("page", "1");
          setHash(base, q);
        });

        document.getElementById("prevPage").addEventListener("click", () => {
          const q = new URLSearchParams(query);
          q.set("page", String(Math.max(1, page - 1)));
          setHash(base, q);
        });
        document.getElementById("nextPage").addEventListener("click", () => {
          const q = new URLSearchParams(query);
          q.set("page", String(Math.min(pagination.last_page, page + 1)));
          setHash(base, q);
        });
      }

      async function showArticle(articleId) {
        const app = document.getElementById("app");
        app.textContent = "Загрузка статьи…";
        const json = await apiFetch(`/api/articles/${articleId}`);
        const a = json.data;
        const related = a.related_articles ?? [];

        app.innerHTML = `<article>
          <h1 class="title">${escapeHtml(a.title)}</h1>
          <div class="meta" style="margin: 8px 0;">
            <span>Просмотры: ${Number(a.views_count ?? 0)}</span>
            <span>Опубликовано: ${fmtDate(a.published_at)}</span>
          </div>
          <p class="desc">${escapeHtml(a.description ?? "")}</p>
          <div style="white-space: pre-wrap;">${escapeHtml(a.content ?? "")}</div>
          <h2 style="margin-top: 16px;">Похожие статьи</h2>
          <div class="article-list">${related.slice(0, 3).map(renderArticleCard).join("")}</div>
        </article>`;
      }

      async function router() {
        const { base, query } = parsePath();
        try {
          if (base === "/" || base === "") {
            await showHome();
            return;
          }
          const catMatch = base.match(/^\/categories\/(\d+)$/);
          if (catMatch) {
            const q = new URLSearchParams(query);
            if (!q.get("per_page")) q.set("per_page", "3");
            if (!q.get("sort")) q.set("sort", "published_at");
            if (!q.get("order")) q.set("order", "desc");
            await showCategory(catMatch[1], q);
            return;
          }
          const artMatch = base.match(/^\/articles\/(\d+)$/);
          if (artMatch) {
            await showArticle(artMatch[1]);
            return;
          }
          document.getElementById("app").textContent = "Страница не найдена";
        } catch (e) {
          document.getElementById("app").textContent = e.message || String(e);
        }
      }

      window.addEventListener("hashchange", router);
      window.addEventListener("DOMContentLoaded", router);
    </script>
  </body>
</html>
