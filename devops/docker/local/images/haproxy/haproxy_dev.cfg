defaults
    mode http

    timeout connect 2s
    timeout client 20s
    timeout client-fin 10s
    timeout server 30s
    timeout server-fin 10s

    timeout http-request 5s
    timeout http-keep-alive 60s
    timeout queue 5s
    timeout tunnel 1h

frontend http
    bind *:80

    acl api_url path_beg -i /api/

    use_backend api if api_url
    use_backend app

backend app
    server s4 app:80

backend api
    server s5 api:80
